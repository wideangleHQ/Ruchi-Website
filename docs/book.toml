[book]
title = "RUCHI Foodline Website Engineering Handbook"
authors = ["WideAngle Media & Technologies"]
description = "Technical handbook for the Ruchi Foodline custom ecommerce storefront — Next.js, Shopify Headless, design system, deployment and maintenance."
language = "en"
src = "src"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
smart-punctuation = false
no-section-label = false
git-repository-url = ""
edit-url-template = ""
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 2

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
